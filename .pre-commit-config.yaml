# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# ==============================================================================
# pre-commit Configuration — LLM & System Optimierungen
# ==============================================================================
# Automatische Qualitäts- und Sicherheitsprüfungen vor jedem Git-Commit & Push:
#  - Conventional Commits Prüfung (bumuellp/cabumtain-hook)
#  - Schutz vor versehentlichem Committen von großen Modelldateien (GGUF > 2MB)
#  - Syntax- und Formatierungsprüfungen für YAML, Shell-Skripte und Zeilenenden
#  - Tag Immutability Guard beim Git-Push
#
# Aktivierung:
#   ./scripts/setup-pre-commit.sh
# ==============================================================================
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # 1. Basis-Dateihygiene & Git-Sicherheit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ['--maxkb=2048'] # Verhindert versehentliches Committen von GGUF-Tensordateien (>2MB)
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # 2. Shell Script Linting & Syntaxprüfung
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-e, SC1091]

  # 3. YAML Linting (saubere Compose- und Config-Dateien)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, '{extends: relaxed, rules: {line-length: {max: 200}}}']

  # 4. cabumtain-hook (bumuellp): Conventional Commits & Tag Immutability
  - repo: https://github.com/bumuellp/cabumtain-hook
    rev: main
    hooks:
      - id: commit-msg
        stages: [commit-msg]
      - id: tag-immutability-guard
        stages: [pre-push]
